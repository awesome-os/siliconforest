name: Awesome-OS CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repo, manifests & C11 B8G ABI bridge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required repository files & upstream MIT license
        run: |
          test -f LICENSE
          grep -q "MIT License" LICENSE
          test -f README.md
          test -f NOTICE
          test -f AWESOME-OS-INTEGRATION.md
          test -f include/b8g_siliconforest_abi.h

      - name: Syntax-check & compile-test C11 B8G_ABI_MAGIC_V3 bridge header
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only include/b8g_siliconforest_abi.h
          cat << 'EOF' > /tmp/test_b8g_sf_abi.c
          #include "include/b8g_siliconforest_abi.h"
          #include <stdio.h>
          int main(void) {
              B8gArenaV1Header arena = {
                  .arena_magic = B8G_ARENA_V1_MAGIC,
                  .abi_magic = B8G_ABI_MAGIC_V3,
                  .version = B8G_SILICONFOREST_ABI_VER,
                  .byte_length = 4096u
              };
              B8gSiliconForestBridgeDesc desc = {
                  .abi_magic = B8G_ABI_MAGIC_V3,
                  .abi_version = B8G_SILICONFOREST_ABI_VER,
                  .kext_kind = B8G_SF_KEXT_GPU_AGX,
                  .peer_target = B8G_SF_PEER_T2XNU,
                  .fb_width = 2560u,
                  .fb_height = 1600u
              };
              if (b8g_sf_validate_arena(&arena) != B8G_SF_OK) return 1;
              if (b8g_sf_validate_desc(&desc) != B8G_SF_OK) return 2;
              printf("b8g_siliconforest_abi OK (magic=0x%08x, align=%zu)\n",
                     desc.abi_magic, alignof(B8gArenaV1Header));
              return 0;
          }
          EOF
          gcc -std=c11 -Wall -Wextra -Werror -I. /tmp/test_b8g_sf_abi.c -o /tmp/test_b8g_sf_abi
          /tmp/test_b8g_sf_abi

      - name: Lightweight Python syntax validation for repository tooling
        run: |
          python3 -m py_compile tools/sf_rename.py
