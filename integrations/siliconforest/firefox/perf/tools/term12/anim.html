<!doctype html><meta charset=utf-8><title>t12 anim</title>
<style>body{margin:0;background:#f4f4f8;font:18px sans-serif}.b{position:absolute;width:140px;height:140px;border-radius:18px}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}@keyframes hue{from{background:#e44}50%{background:#44e}to{background:#e44}}
@keyframes mv{from{left:40px}to{left:1000px}}</style>
<div class=b style="left:60px;top:80px;background:#e85;animation:spin 2s linear infinite"></div>
<div class=b style="left:300px;top:80px;background:#5a8;animation:spin 3s linear infinite reverse"></div>
<div class=b style="left:540px;top:80px;animation:hue 2s linear infinite"></div>
<div class=b style="top:300px;background:#86c;animation:mv 3s ease-in-out infinite alternate"></div>
<p style="position:absolute;top:500px;left:40px">TERM12 animation page: transforms, colours, a left: move</p>
