<!doctype html><meta charset="utf-8"><title>SF-FX presentation series</title>
<style>
body{margin:0;background:#f5f6fa;color:#172438;font:20px sans-serif}
header{padding:14px;background:#17354c;color:white}section{padding:16px}
.row{height:80px;border-bottom:1px solid #bed0d8;contain:content;padding:8px;box-sizing:border-box}
.tile{position:absolute;width:54px;height:54px;border-radius:9px;background:#1689b0;
animation:move 2s linear infinite alternate}
@keyframes move{from{transform:translateX(0) rotate(0);opacity:.5}to{transform:translateX(650px) rotate(180deg);opacity:1}}
video{width:960px;max-width:95vw;height:auto;display:block}
</style><header id="heading">SiliconForest presentation gate</header><section id="work"></section>
<script>
const parameters=new URL(location.href).searchParams,kind=parameters.get('case'),
 automatic=parameters.get('automatic')==='1',work=document.querySelector('#work');
let token=0,until=0,distance=0,previousY=0,started=0;
if(kind==='scroll'){
 const fragment=document.createDocumentFragment();
 for(let i=0;i<1000;i++){const row=document.createElement('div');row.className='row';
  row.style.background=i%2?'#e4edf4':'#f5f6fa';row.textContent=`Row ${i} · Firefox native presentation · ABC abc 0123456789`;fragment.append(row);}
 work.append(fragment);
}else if(kind==='css'){
 work.style.height='850px';
 for(let i=0;i<40;i++){const tile=document.createElement('div');tile.className='tile';
 tile.style.top=(100+(i%10)*70)+'px';tile.style.left=(30+Math.floor(i/10)*180)+'px';
 tile.style.animationDelay=(-i*.083)+'s';tile.style.background=`hsl(${i*41} 65% 45%)`;work.append(tile);}
}else if(kind==='video'){
 const video=document.createElement('video');video.id='video';video.muted=true;
 video.preload='auto';video.playsInline=true;video.src='frame-id-1080p60.mp4';work.append(video);
}
window.fxBenchState=()=>{
 const v=document.querySelector('video'),q=v?.getVideoPlaybackQuality();
 return {kind,wall:performance.now(),visibility:document.visibilityState,started,
  active:kind!=='scroll'||performance.now()<until,scrollY,distance,
  video:v?{width:v.videoWidth,height:v.videoHeight,time:v.currentTime,paused:v.paused,ended:v.ended,
   decoded:q.totalVideoFrames,dropped:q.droppedVideoFrames,error:v.error?.code||null}:null};
};
window.fxBenchStart=async()=>{
 started=performance.now();distance=0;previousY=scrollY;until=started+(automatic?60000:20000);
 if(kind==='scroll'){
  scrollTo(0,0);previousY=0;
  const tick=now=>{if(now>=until)return;scrollTo(0,(now-started)*2);
   distance+=Math.abs(scrollY-previousY);previousY=scrollY;token=requestAnimationFrame(tick);};
  token=requestAnimationFrame(tick);
 }
 if(kind==='video'){
  const v=document.querySelector('video'),deadline=performance.now()+10000;
  while(v.readyState<2&&!v.error){if(performance.now()>deadline)throw Error('Video readiness deadline');await new Promise(r=>setTimeout(r,25));}
  if(v.error||v.videoWidth!==1920||v.videoHeight!==1080)throw Error('Wrong video fixture');
  v.loop=automatic;v.currentTime=0;await v.play();started=performance.now();
 }
 return fxBenchState();
};
window.fxBenchStop=()=>{cancelAnimationFrame(token);until=0;document.querySelector('video')?.pause();return fxBenchState();};
</script>
