<!doctype html>
<meta charset="utf-8">
<title>SF-FX colour and fallback fixture</title>
<style>
body{font:24px/1.6 system-ui;background:white;color:#171d22;margin:24px}
.swatch{display:inline-block;width:120px;height:80px;margin:10px;border:1px solid black;image-rendering:pixelated}
p{margin:10px 0}canvas{border:1px solid #ccc}
</style>
<h1>Firefox colour and glyph controls</h1>
<p>Both source images encode RGB 128. The linear ICC image should map to approximately 188 when colour management uses the controlled sRGB display profile.</p>
<img class="swatch" id="linear" src="quality-assets/linear-rgb.png" alt="linear ICC">
<img class="swatch" id="srgb" src="quality-assets/srgb.png" alt="sRGB ICC">
<span class="swatch" style="background:rgb(128,128,128)"></span>
<p style="font-family:serif">Serif — AV To fi ffi — Ελληνικά — Кириллица</p>
<p style="font-family:sans-serif">Fallback — 日本語 中文 — देवनागरी — العربية</p>
<p>Emoji — 🙂 🌲 🚀 ❤️ 🏳️‍🌈</p>
<canvas id="glyphs" width="1152" height="180"></canvas>
<pre id="result"></pre>
<script>
window.fxQualityPixels=async()=>{
 const result={devicePixelRatio,colour:{},fonts:[]};
 for(const id of ['linear','srgb']){
  const image=document.getElementById(id);await image.decode();
  const c=document.createElement('canvas');c.width=c.height=16;
  const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(image,0,0);
  result.colour[id]=[...ctx.getImageData(8,8,1,1).data];
 }
 const canvas=document.getElementById('glyphs'),ctx=canvas.getContext('2d',{willReadFrequently:true});
 ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='black';
 const texts=['AV To fi ffi','Ελληνικά','Кириллица','日本語 中文','देवनागरी','العربية','🙂 🌲 🚀'];
 for(let i=0;i<texts.length;i++){
  ctx.font='28px sans-serif';const x=(i%4)*288,y=Math.floor(i/4)*90+48;ctx.fillText(texts[i],x+8,y);
  const metrics=ctx.measureText(texts[i]);result.fonts.push({text:texts[i],advance:metrics.width,
   left:metrics.actualBoundingBoxLeft,right:metrics.actualBoundingBoxRight});
 }
 result.glyphImage=canvas.toDataURL('image/png');
 document.getElementById('result').textContent=JSON.stringify({...result,glyphImage:'separate PNG'},null,2);
 return result;
};
</script>
