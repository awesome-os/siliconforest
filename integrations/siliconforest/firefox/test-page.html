<!doctype html>
<meta charset="utf-8">
<title>SiliconForest Firefox fixture</title>
<style>
body { margin: 24px; font: 18px/1.6 system-ui; color: #17242b; background: #f8faf8; }
article { max-width: 900px; }
canvas { width: 320px; height: 200px; border: 1px solid #273e48; }
.motion { width: 40px; height: 40px; background: #23795e; animation: travel 2s linear infinite alternate; }
@keyframes travel { to { transform: translateX(500px) rotate(180deg); } }
pre { white-space: pre-wrap; }
</style>
<article>
<h1>SiliconForest · Firefox</h1>
<p>Fractional scale: sharp text, precise positions, colour and smooth movement.</p>
<p style="font-family:serif">Serif: AV To fi ffi — Ελληνικά — Кириллица</p>
<p style="font-family:monospace">Monospace: 0123456789, ()[]{}, &lt;=&gt;</p>
<p>Fallback: 中文 日本語 한국어 · 🌲 🌎 🙂</p>
<label>Typing: <input id="typing" placeholder="Command shortcuts and clipboard"></label>
<button id="button">Count a click</button><output id="clicks">0</output>
<p><canvas width="320" height="200" id="gl"></canvas></p>
<div class="motion"></div>
<pre id="result">Collecting actual WebGL and animation frame results…</pre>
<div id="long"></div>
</article>
<script>
const button = document.querySelector('#button'), clicks = document.querySelector('#clicks');
button.onclick = () => { clicks.value = Number(clicks.value) + 1; };
const canvas = document.querySelector('#gl');
const gl = canvas.getContext('webgl', {antialias: false, preserveDrawingBuffer: true});
window.fxResult = {devicePixelRatio, webgl: !!gl, frames: []};
if (gl) {
  const vertex = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vertex, 'attribute vec2 p; varying vec2 c; void main(){c=p*.5+.5;gl_Position=vec4(p,0.,1.);}');
  gl.compileShader(vertex);
  const fragment = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fragment, 'precision mediump float; varying vec2 c; void main(){gl_FragColor=vec4(c.x,c.y,.25,1.);}');
  gl.compileShader(fragment);
  const program = gl.createProgram(); gl.attachShader(program, vertex); gl.attachShader(program, fragment);
  gl.linkProgram(program); gl.useProgram(program);
  const buffer = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, 0,1]), gl.STATIC_DRAW);
  const location = gl.getAttribLocation(program, 'p');
  gl.enableVertexAttribArray(location); gl.vertexAttribPointer(location, 2, gl.FLOAT, false, 0, 0);
  gl.clearColor(.2,.4,.6,1); gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.TRIANGLES,0,3);
  const pixels = new Uint8Array(320*200*4); gl.readPixels(0,0,320,200,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
  let hash = 2166136261;
  for (const byte of pixels) hash = Math.imul(hash ^ byte, 16777619) >>> 0;
  const debug = gl.getExtension('WEBGL_debug_renderer_info');
  Object.assign(fxResult, {hash:hash.toString(16), glError:gl.getError(),
    vendor:gl.getParameter(debug ? debug.UNMASKED_VENDOR_WEBGL : gl.VENDOR),
    renderer:gl.getParameter(debug ? debug.UNMASKED_RENDERER_WEBGL : gl.RENDERER),
    linked:gl.getProgramParameter(program,gl.LINK_STATUS)});
}
for (let i=0;i<150;i++) {
  const p = document.createElement('p'); p.textContent = `${i+1}. Scrolling fixture — precise glyph positions, quick fox, green forest.`;
  document.querySelector('#long').append(p);
}
let frameToken;
window.fxMeasureFrames = (duration=10000, scroll=false) => {
  if (frameToken) cancelAnimationFrame(frameToken);
  fxResult.frames=[];
  return new Promise(resolve => {
    const stamps=[], wallStamps=[]; let wallStart;
    function frame(timestamp) {
      stamps.push(timestamp);
      wallStamps.push(performance.now());
      if(stamps.length===1)wallStart=wallStamps[0];
      const elapsed=timestamp-stamps[0];
      if (scroll) window.scrollTo(0,Math.max(0,Math.sin(elapsed/2000)*2000));
      if (stamps.length < 2 || elapsed < duration) { frameToken=requestAnimationFrame(frame); return; }
      const deltas=stamps.slice(1).map((v,i)=>v-stamps[i]), sorted=[...deltas].sort((a,b)=>a-b);
      const wallDeltas=wallStamps.slice(1).map((v,i)=>v-wallStamps[i]), wallSorted=[...wallDeltas].sort((a,b)=>a-b);
      Object.assign(fxResult, {frames:deltas, median:sorted[Math.floor(sorted.length*.5)],
        p95:sorted[Math.floor(sorted.length*.95)], max:Math.max(...deltas),
        fps:1000*deltas.length/elapsed, wallFps:1000*deltas.length/(performance.now()-wallStart),
        wallStart,wallEnd:performance.now(),timeOrigin:performance.timeOrigin,
        wallStamps,wallMedian:wallSorted[Math.floor(wallSorted.length*.5)],
        wallP95:wallSorted[Math.floor(wallSorted.length*.95)],wallMax:Math.max(...wallDeltas),
        duration:elapsed, programmaticScroll:scroll});
      document.querySelector('#result').textContent=JSON.stringify(fxResult,null,2);
      document.title=`SF-FX WebGL=${fxResult.webgl} fps=${fxResult.fps.toFixed(2)} scale=${devicePixelRatio}`;
      resolve(fxResult);
    }
    frameToken=requestAnimationFrame(frame);
  });
};
fxMeasureFrames();
</script>
