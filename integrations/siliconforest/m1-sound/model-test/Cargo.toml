# Host-only (x86_64 Linux): compares the kernel's speaker model (../kernel/sf_speaker_model.c)
# with the reference, upstream speakersafetyd's model code as ../safetyd/tests/upstream-ref
# builds it (types.rs and helpers.rs unmodified, dB conversions by the real alsa-lib).
[package]
name = "model-test"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[dependencies]
alsa = { path = "../safetyd/tests/upstream-ref/stubs/alsa" }
configparser = { path = "../safetyd/tests/upstream-ref/stubs/configparser" }
log = "^0.4.29"

[profile.release]
debug = 1
