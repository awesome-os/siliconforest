[package]
name = "speakersafetyd"
version = "2.0.1"
edition = "2021"
license = "MIT"
description = "Speaker protection daemon (Asahi speakersafetyd 2.0.1, ported to the SiliconForest guest)"
repository = "https://github.com/AsahiLinux/speakersafetyd/"

# Upstream's alsa, configparser, clap-verbosity-flag and simple_logger are gone: alsa is
# replaced by /dev/sfspeaker-safety (src/device.rs), the other three are not in the
# offline registry and have small replacements in src/ini.rs and src/logger.rs.
[dependencies]
clap = { version = "^4.6.1", features=["derive"] }
log = "^0.4.29"
signal-hook = "^0.4.4"
libc = "^0.2.185"

[[test]]
name = "process"
harness = false
