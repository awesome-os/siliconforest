# Host-only reference: upstream speakersafetyd's types.rs and helpers.rs, UNMODIFIED
# (upstream/, byte-identical copies of git 4175df66), compiled against a stand-in for
# the alsa crate (stubs/alsa: a fake J293 card whose dB conversions are done by the
# real alsa-lib, libasound.so.2, loaded at run time) and a stand-in for configparser.
# Not part of the daemon; its own workspace so that cargo does not mix the two.
[package]
name = "upstream-ref"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[dependencies]
alsa = { path = "stubs/alsa" }
configparser = { path = "stubs/configparser" }
log = "^0.4.29"
