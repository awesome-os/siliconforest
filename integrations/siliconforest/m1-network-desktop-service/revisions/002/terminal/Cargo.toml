[package]
name = "chonk-desktop-network-terminal"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
resolver = "2"

[dependencies]
libc = "=0.2.190"
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "unstable"] }
xkbcommon = { version = "=0.8.0", default-features = false }
tiny-skia = { version = "=0.11.4", default-features = false, features = ["std", "simd"] }
ttf-parser = "=0.25.1"
serde_json = "=1.0.151"
serde = "=1.0.229"

[dev-dependencies]
wayland-server = "=0.31.14"
wayland-protocols = { version = "=0.32.13", features = ["server", "unstable"] }
