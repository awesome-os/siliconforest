<!-- SiliconForest mark, first draft (DESK2, 14 November 2026): a conifer of three circuit-trace
     tiers with vias at their tips on a trunk trace ending in a row of chip pads, light on a dark
     badge. The dock draws the same geometry in code (sources/chonkstep-darwin
     dock/crates/chonk-dock/src/siliconforest.rs, `mark`); this file is the same drawing for people. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <rect x="4" y="4" width="92" height="92" rx="20" fill="#0d1a15"/>
  <g fill="none" stroke="#a6f2c8" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 17 V80"/>
    <path d="M33 36 L50 17 L67 36"/>
    <path d="M25 55 L50 33 L75 55"/>
    <path d="M17 74 L50 50 L83 74"/>
    <path d="M30 84 H70"/>
  </g>
  <g fill="#a6f2c8">
    <circle cx="33" cy="36" r="4.5"/><circle cx="67" cy="36" r="4.5"/>
    <circle cx="25" cy="55" r="4.5"/><circle cx="75" cy="55" r="4.5"/>
    <circle cx="17" cy="74" r="4.5"/><circle cx="83" cy="74" r="4.5"/>
    <rect x="31" y="86.5" width="6" height="5"/><rect x="47" y="86.5" width="6" height="5"/><rect x="63" y="86.5" width="6" height="5"/>
  </g>
  <g fill="#0d1a15">
    <circle cx="33" cy="36" r="2"/><circle cx="67" cy="36" r="2"/>
    <circle cx="25" cy="55" r="2"/><circle cx="75" cy="55" r="2"/>
    <circle cx="17" cy="74" r="2"/><circle cx="83" cy="74" r="2"/>
  </g>
</svg>
