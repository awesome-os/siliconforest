<!doctype html>
<!-- The page the Firefox checks load (checks/firefox-page.json). Each thing that works is said in
     the document's title, which Firefox puts in its window's title, which the compositor's frame
     shows and the WindowServer trace prints - so a check can wait for it without reading pixels. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>SF page: loading</title>
<style>
  body { font: 16px/1.4 sans-serif; margin: 24px; background: #f4f1e8; color: #1b2a22; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  #swatch { width: 160px; height: 40px; background: rgb(51, 115, 204); margin: 12px 0; }
  input { font: inherit; padding: 4px 6px; width: 240px; }
  button { font: inherit; padding: 8px 20px; margin-left: 12px; }
</style>
</head>
<body>
<h1>SiliconForest</h1>
<p>Firefox for macOS, running on Darwin on Apple silicon without macOS: this text is laid out and
drawn by Gecko, through WebRender, into a Cocoa window.</p>
<img id="picture" src="picture.png" width="160" height="100" alt="test picture">
<div id="swatch"></div>
<p><input id="field" autofocus placeholder="type here"><button id="button">Press</button></p>
<p id="log">waiting</p>
<script>
  var state = { page: "loaded", image: "no", typed: "", clicks: 0 };
  function say() {
    document.title = "SF page: " + state.page + " image=" + state.image + " typed=" + state.typed + " clicks=" + state.clicks;
    document.getElementById("log").textContent = document.title;
  }
  var picture = document.getElementById("picture");
  function pictureDone() { state.image = picture.naturalWidth + "x" + picture.naturalHeight; say(); }
  if (picture.complete) pictureDone(); else picture.addEventListener("load", pictureDone);
  picture.addEventListener("error", function () { state.image = "failed"; say(); });
  document.getElementById("field").addEventListener("input", function (e) { state.typed = e.target.value; say(); });
  document.getElementById("button").addEventListener("click", function () {
    state.clicks++; document.getElementById("swatch").style.background = "rgb(204, 60, 51)"; say();
  });
  say();
  document.getElementById("field").focus();
</script>
</body>
</html>
