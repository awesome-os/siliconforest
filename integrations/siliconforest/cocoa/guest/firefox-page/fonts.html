<!doctype html>
<!-- Font test for the Firefox checks: families, weights, sizes, emoji and CJK. Every sample is
     also drawn into a canvas and its inked pixels counted, so a face that lays out but draws
     nothing (the missing heading on example.com) shows up in the title as a name, not as a hole
     someone has to see. Title: "SF fonts: N samples, blank=<names or none>". -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>SF fonts: measuring</title>
<style>
  body { font: 15px/1.35 sans-serif; margin: 16px; background: #fff; color: #111; }
  table { border-collapse: collapse; }
  td { padding: 1px 12px 1px 0; vertical-align: baseline; white-space: nowrap; }
  td.n { font: 11px monospace; color: #555; }
  td.blank { background: #fbb; }
</style>
</head>
<body>
<table id="t"></table>
<p id="log">measuring</p>
<script>
  var text = "Hamburgefonstiv 0123";
  var samples = [];
  ["system-ui", "-apple-system", "sans-serif", "serif", "monospace", "Helvetica", "Times", "Courier", "Menlo"].forEach(function (f) {
    samples.push({ name: f + " 400", css: "400 15px " + f, text: text });
    samples.push({ name: f + " 700", css: "700 15px " + f, text: text });
  });
  [100, 200, 300, 500, 600, 800, 900].forEach(function (w) {
    samples.push({ name: "system-ui " + w, css: w + " 15px system-ui", text: text });
  });
  [9, 11, 13, 20, 24, 32].forEach(function (s) {
    samples.push({ name: "system-ui 700 " + s + "px", css: "700 " + s + "px system-ui", text: "Example Domain" });
  });
  samples.push({ name: "italic", css: "italic 400 15px system-ui", text: text });
  samples.push({ name: "emoji", css: "400 15px system-ui", text: "\u{1F332}\u{1F525}\u{1F600}❤️" });
  samples.push({ name: "cjk", css: "400 15px system-ui", text: "森林 こんにちは 한국어" });
  samples.push({ name: "greek-cyrillic", css: "400 15px system-ui", text: "Αβγ Жзи" });
  samples.push({ name: "symbols", css: "400 15px system-ui", text: "→ ✓ © € ∞" });

  function ink(sample) {
    var c = document.createElement("canvas");
    c.width = 600; c.height = 60;
    var g = c.getContext("2d");
    g.font = sample.css; g.fillStyle = "#000"; g.textBaseline = "middle";
    g.fillText(sample.text, 4, 30);
    var d = g.getImageData(0, 0, 600, 60).data, n = 0;
    for (var i = 3; i < d.length; i += 4) if (d[i] > 40) n++;
    return { pixels: n, width: Math.round(g.measureText(sample.text).width) };
  }
  function run() {
    var blank = [], t = document.getElementById("t");
    t.textContent = "";
    samples.forEach(function (s) {
      var m = ink(s), row = t.insertRow(), a = row.insertCell(), b = row.insertCell(), c = row.insertCell();
      a.className = "n"; a.textContent = s.name;
      b.style.font = s.css; b.textContent = s.text;
      c.className = "n"; c.textContent = m.width + " px wide, " + m.pixels + " inked";
      if (m.pixels < 20) { blank.push(s.name.replace(/ /g, "_")); row.cells[1].className = "blank"; }
    });
    document.title = "SF fonts: " + samples.length + " samples, blank=" + (blank.length ? blank.join(",") : "none");
    document.getElementById("log").textContent = document.title;
  }
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(run);
</script>
</body>
</html>
